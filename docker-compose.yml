services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Никакой персистентности: сообщения живут только по TTL.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy volatile-ttl
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    # Слушаем только на localhost — TLS и проксирование наружу через Caddy/Nginx.
    ports:
      - "127.0.0.1:8000:8000"
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:
    driver: bridge